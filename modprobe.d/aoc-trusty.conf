# AoC secure-world bring-up: load order for the Trusty stack before aoc_core.
#
# Probe chain (see trusty.c:of_platform_populate):
#   trusty-core -> (of_platform_populate) -> trusty-log, trusty-virtio-v1 node
#   trusty-virtio (auto, MODULE_DEVICE_TABLE of) -> registers tipc virtio device
#   trusty-ipc    (auto, MODULE_DEVICE_TABLE tipc) -> /dev/trusty-ipc*
#
# trusty-core does NOT auto-load from DT (its device table is the custom
# "trusty" bus, not "of"), so it must be pulled explicitly. Listing the whole
# chain on aoc_core guarantees modprobe order regardless of uevent timing;
# the per-module pre: lines keep the order if any module is loaded directly.
options aoc_core aoc_early_magic=1 aoc_ignore_watchdog=1 aoc_disable_restart=0 aoc_disable_mm=0
# Ensure the engine (and thus the child devices) exists before the transports.
softdep trusty-virtio pre: trusty-core trusty-ipc
#softdep trusty-ipc     pre: trusty-core trusty-virtio
softdep trusty-ipc     pre: trusty-core

# Bring the whole secure stack up before AoC boots FF1.
softdep aoc_core pre: trusty-core trusty-log trusty-virtio trusty-ipc
